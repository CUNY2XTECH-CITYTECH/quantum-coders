version: '3.8'
services:

    postgres:
      image: postgres
      restart: always
      ports:
          - '5432:5432'
      environment:
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_USER=postgres
        - POSTGRES_DB=test2
      volumes:
        - postgres_data: /var/lib/postgresql/data

    
    supertokens:
      image: registry.supertokens.io/supertokens/supertokens-postgresql
volumes:
  postgres_data: