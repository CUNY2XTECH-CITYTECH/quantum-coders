version: '3.8'
services:
    postgres:
      image: postgres
      restart: always
      ports:
          - '5432:5432'
      environment:
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_USER=postgres
        - POSTGRES_DB=test2
      volumes:
        - postgres_data:/var/run/postgresql/data
      healthcheck: 
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 3
    migrations:
      build: .
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        - DATABASE_URL="postgresql://postgres:postgres@localhost:5432/test2"

    
    supertokens:
      image: registry.supertokens.io/supertokens/supertokens-postgresql

volumes:
  postgres_data:
 