app = "cool-frog-1547"

[build]
# (your build configuration)

[mounts]
  source = "pg_data"
  destination = "/data"

[[services]]
  internal_port = 3001   # change from 5432 to 3001
  protocol = "tcp"

[[services.ports]]
  port = 80              # public port (or 443 for HTTPS)
  handlers = ["http"]

[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  restart_limit = 6
